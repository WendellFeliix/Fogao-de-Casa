<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Fogão de Casa: busque receitas por nome ou categoria, veja ingredientes e modo de preparo e salve suas favoritas.">
<title>Fogão de Casa — Receitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="logo">Fogão de Casa</h1>
    <p class="tagline">receitas de verdade, pra cozinhar hoje</p>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <label class="search" for="searchInput">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" aria-label="Buscar receitas por nome" placeholder="Buscar por nome — ex: chicken, cake, pasta...">
    </label>

    <div class="tabs">
      <button type="button" class="tab is-active" data-tab="todas" aria-pressed="true">Todas</button>
      <button type="button" class="tab" data-tab="favoritas" aria-pressed="false">Favoritas <span id="favCount" class="tab-count">0</span></button>
    </div>
  </div>

  <div class="chips" id="categoryChips" role="group" aria-label="Filtrar por categoria">
    <!-- categorias inseridas via JS -->
  </div>
</div>

<main class="content">
  <div class="grid" id="recipeGrid" aria-live="polite" aria-busy="false">
    <!-- skeletons / cards inseridos via JS -->
  </div>

  <div class="empty-state" id="emptyState" hidden>
    <p class="empty-title">Nenhuma receita por aqui</p>
    <p class="empty-sub">Tenta outro termo de busca ou escolhe outra categoria.</p>
  </div>
</main>

<noscript>
  <p style="text-align:center; padding:40px;">O Fogão de Casa precisa de JavaScript para carregar as receitas.</p>
</noscript>

<!-- Modal de detalhe -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" class="modal-close" id="closeModalBtn" aria-label="Fechar">&times;</button>
    <div id="modalBody" class="modal-body"><!-- conteúdo inserido via JS --></div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
